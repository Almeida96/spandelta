name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test and assemble
        shell: bash
        run: ./gradlew test installDist distZip --no-daemon --console=plain
      - name: Check packaged CLI and decision codes
        shell: bash
        run: |
          build/install/spandelta/bin/spandelta demo --out build/checkout-demo
          python checks/gate.py build/install/spandelta build/checkout-demo
      - name: Query through the official MCP client
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'mcp==1.26.0'
          python examples/agent_investigation.py build/install/spandelta build/checkout-demo/traces.db
      - name: Attach test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}
          path: build/test-results/test/*.xml
      - name: Prepare release files
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p build/publish
          cp build/checkout-demo/report.html build/publish/checkout-regression.html
          cp build/distributions/spandelta-0.1.0.zip build/publish/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: distribution
          path: build/publish/*
          if-no-files-found: error
  release:
    name: Publish verified release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release SpanDelta 0.1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution
          path: release
      - name: Publish ZIP, report and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum spandelta-0.1.0.zip checkout-regression.html > SHA256SUMS
          gh release create v0.1.0 spandelta-0.1.0.zip checkout-regression.html SHA256SUMS --target "$GITHUB_SHA" --title "SpanDelta 0.1.0" --notes-file ../docs/release.md
